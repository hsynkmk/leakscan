name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege for the workflow token

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        run: go test -race -cover ./...
      - name: Known vulnerabilities in dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Dogfooding - leakscan scans its own repository
        run: go run ./cmd/leakscan scan --fail-on low .
      - name: SARIF report
        run: go run ./cmd/leakscan scan --format sarif . > leakscan.sarif || true
      - uses: actions/upload-artifact@v4
        with:
          name: leakscan-sarif
          path: leakscan.sarif

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leakscan .
